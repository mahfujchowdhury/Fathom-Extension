<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fathom — dashboard</title>
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="side" aria-label="Workspace">
        <div class="brand-row">
          <svg class="brand-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="8.2" stroke="currentColor" stroke-width="1.6" />
            <path
              d="M12 3.8c2.6 2.4 4 5.2 4 8.2s-1.4 5.8-4 8.2c-2.6-2.4-4-5.2-4-8.2s1.4-5.8 4-8.2Z"
              stroke="currentColor"
              stroke-width="1.3"
              opacity=".65"
            />
            <circle cx="12" cy="12" r="2.1" fill="currentColor" />
          </svg>
          <span class="brand-name">Fathom</span>
        </div>

        <div class="side-nav">
          <p class="side-eyebrow">Your workspace</p>
          <nav class="nav" id="nav" aria-label="Dashboard sections">
            <button class="nav-item" type="button" data-route="overview" aria-current="page">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <rect x="3.5" y="3.5" width="7" height="7" rx="1.5" />
                <rect x="13.5" y="3.5" width="7" height="7" rx="1.5" />
                <rect x="3.5" y="13.5" width="7" height="7" rx="1.5" />
                <rect x="13.5" y="13.5" width="7" height="7" rx="1.5" />
              </svg>
              <span>Overview</span>
            </button>
            <button class="nav-item" type="button" data-route="capture">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <path d="M4 8.5h3l1.4-2h7.2l1.4 2H20a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1Z" />
                <circle cx="12" cy="13.5" r="3.1" />
              </svg>
              <span>Capture</span>
            </button>
            <button class="nav-item" type="button" data-route="history">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <circle cx="12" cy="12" r="8.2" />
                <path d="M12 7.4V12l3.2 1.9" />
              </svg>
              <span>Capture history</span>
            </button>
            <button class="nav-item" type="button" data-route="dock">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <rect x="3.5" y="4.5" width="17" height="15" rx="2" />
                <path d="M3.5 15.4h17" />
                <path d="M9.5 18.2h5" />
              </svg>
              <span>Dock &amp; sidebar</span>
            </button>
            <button class="nav-item" type="button" data-route="responsive">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <rect x="3" y="4.5" width="18" height="12" rx="2" />
                <path d="M9 20h6M12 16.5V20" />
              </svg>
              <span>Responsive viewer</span>
            </button>
            <button class="nav-item" type="button" data-route="about">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <circle cx="12" cy="12" r="8.4" />
                <path d="M12 11v5.2" />
                <path d="M12 7.7h.01" />
              </svg>
              <span>About</span>
            </button>
          </nav>
        </div>

        <div class="side-foot">
          <p class="foot-version" id="sidebar-version">Fathom</p>
          <p class="foot-note">Made for a closer look.</p>
        </div>
      </aside>

      <main class="main">
        <div class="main-inner">
          <header class="page-head">
            <p class="eyebrow">Fathom dashboard</p>
            <div class="head-row">
              <div class="head-copy">
                <h1 id="page-title" tabindex="-1">Overview</h1>
                <p class="page-desc" id="page-desc">Your tools, your setup. Everything in one place.</p>
              </div>
              <p class="save-note" id="save-state" role="status" aria-live="polite">Settings save automatically</p>
            </div>
          </header>

          <div id="content">
            <section class="route" aria-label="Loading">
              <div class="card empty-card">
                <div class="empty-state">
                  <strong>Loading dashboard…</strong>
                  <p>The workspace is getting its settings.</p>
                </div>
              </div>
            </section>
          </div>
        </div>
      </main>
    </div>

    <p class="toast" id="toast" role="status" aria-live="polite"></p>

    <script src="../lib/settings.js" defer></script>
    <script src="../lib/capture-store.js" defer></script>
    <script src="dashboard.js" defer></script>
  </body>
</html>
